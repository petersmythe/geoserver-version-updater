name: Checks

# Runs on every pull request (including alpha -> main). Read-only: it cannot
# publish anything. Make this check required for main in the repository settings.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Validate the committed versions.json
        run: python3 scripts/validate_feed.py versions.json

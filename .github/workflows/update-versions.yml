name: Update GeoServer version feed

on:
  # Primary trigger: an external scheduler sends an authenticated
  # repository_dispatch event every 15 minutes, because GitHub's own scheduler
  # is unreliable under load. repository_dispatch and schedule only ever run
  # on the default branch.
  repository_dispatch:
    types: [update-versions]
  # Fallback. Offset minutes avoid the :00/:15/:30/:45 herd times.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Manual run from the Actions tab, or via the REST API with "ref": "alpha"
  # to regenerate the alpha feed.
  workflow_dispatch: {}
  # The alpha branch is not reached by the triggers above, so regenerate it
  # whenever its generator or tests change.
  push:
    branches: [alpha]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-versions.yml'

permissions:
  contents: write

concurrency:
  group: update-versions-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Generate versions.json
        run: python3 scripts/check_versions.py

      - name: Commit versions.json if changed
        id: commit
        run: |
          if git diff --quiet -- versions.json; then
            echo "No change in versions.json, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "gs-updates-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions.json
          git commit -m "Update versions.json [automated]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          # jsDelivr does not notice a new commit by itself. Without this a
          # client could keep receiving a stale feed for hours.
          url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/versions.json"
          echo "Purging: $url"
          for attempt in 1 2 3; do
            status=$(curl -s -o /tmp/purge_response.json -w "%{http_code}" "$url")
            echo "Attempt $attempt: HTTP $status"
            cat /tmp/purge_response.json
            echo
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          # The commit already succeeded and the cache expires on its own TTL.
          echo "::warning::jsDelivr purge did not return 200 after 3 attempts; relying on TTL expiry instead."
